# Render.com blueprint — one web service (Node) + a managed Postgres DB.
# Push to GitHub, then "New > Blueprint" on Render and point it at this repo.
#
# IMPORTANT: this blueprint provisions Postgres. Before deploying with it,
# switch the datasource provider in server/prisma/schema.prisma from
# "sqlite" to "postgresql" (see README → "Ir para produção"). For a quick
# SQLite-on-a-disk deploy instead, drop the `databases` block, set
# DATABASE_URL=file:/data/folio.db and attach a Render disk at /data.
services:
  - type: web
    name: folio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_DIST
        value: ../web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: folio-db
          property: connectionString

databases:
  - name: folio-db
    plan: starter
